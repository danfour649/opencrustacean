name: version-bump-on-merge

# Bumps package.json (and therefore the Control UI version chip, which embeds
# the package version at build time) once per merged PR on main.
# main is branch-protected (no direct pushes), so the bump lands via a
# squash-merged PR (reused if one is already open for that version).
# The workflow skips its own bump PRs to avoid a loop.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.title, 'chore: bump version'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bump package version
        id: bump
        run: echo "version=$(node .github/scripts/bump-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Land version bump (create or reuse PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="version-bump-${VERSION}"
          git config user.name "opencrustacean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If a bump PR for this version is already open (e.g. a previous run
          # failed to land it), merge it instead of colliding on the branch name.
          EXISTING_PR="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${EXISTING_PR}" ]; then
            echo "Bump PR #${EXISTING_PR} for ${VERSION} already exists; merging it."
            if ! gh pr merge "${EXISTING_PR}" --squash --delete-branch; then
              echo "Not immediately mergeable; enabling auto-merge instead."
              gh pr merge "${EXISTING_PR}" --auto --squash --delete-branch
            fi
            exit 0
          fi

          # Orphaned branch with no open PR: clear it before recreating.
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} exists with no open PR; removing it."
            git push origin --delete "${BRANCH}"
          fi

          git checkout -b "${BRANCH}"
          git add package.json
          git commit -m "chore: bump version to ${VERSION}"
          git push origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}"             --title "chore: bump version to ${VERSION}"             --body "Automated version bump (one per merged PR). The header version chip shows this after the next rebuild."
          NEW_PR="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "${NEW_PR}" ]; then
            echo "Failed to find bump PR for ${BRANCH}" >&2
            exit 1
          fi
          echo "Created bump PR #${NEW_PR} for ${VERSION}; merging it."
          if ! gh pr merge "${NEW_PR}" --squash --delete-branch; then
            echo "Not immediately mergeable; enabling auto-merge instead."
            gh pr merge "${NEW_PR}" --auto --squash --delete-branch
          fi
